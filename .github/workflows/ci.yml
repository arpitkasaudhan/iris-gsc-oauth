name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iris-gsc-oauth .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 \
            -e GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com \
            -e GOOGLE_CLIENT_SECRET=ci \
            -e TOKEN_ENCRYPTION_KEYS="k1:$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e SESSION_SECRET=ci \
            iris-gsc-oauth
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
